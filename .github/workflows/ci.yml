name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dependency-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "ICT2516C-webapp"
          path: "webapp"
          format: "HTML"
          out: "dependency-check-report"
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: dependency-check-report

  integration-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test

  eslint-security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Run ESLint security scan (SARIF)
        continue-on-error: true
        run: npx eslint . --format=@microsoft/eslint-formatter-sarif --output-file=eslint-results.sarif
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: webapp/eslint-results.sarif

  ui-test:
    runs-on: ubuntu-latest
    needs: integration-test
    services:
      selenium:
        image: selenium/standalone-chrome
        ports:
          - 4444:4444
        options: --add-host=host.docker.internal:host-gateway
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Start webapp over HTTP
        run: node server.js &
      - name: Wait for webapp to be ready
        run: npx wait-on http://localhost:3000
      - name: Run Selenium UI test
        env:
          APP_URL: http://host.docker.internal:3000
        run: node tests/SeleniumTest.mjs
