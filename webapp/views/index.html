<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ICT2516C Practical Test App</title>
</head>
<body>
  <h1>Search</h1>
  <form id="search-form" action="/search" method="GET">
    <label for="q">Search term:</label>
    <input type="text" id="q" name="q" required minlength="2" maxlength="100">
    <button type="submit">Search</button>
    <p id="search-error" style="color:red;"></p>
  </form>

  <script src="/validate.js"></script>
  <script>
    document.getElementById("search-form").addEventListener("submit", function (event) {
      var input = document.getElementById("q");
      var errorEl = document.getElementById("search-error");

      if (SearchValidation.hasDisallowedCharacters(input.value)) {
        // requirement (g): treat as a potential SQLi/XSS attack attempt -
        // clear the input and stay on the homepage, no reflection.
        event.preventDefault();
        input.value = "";
        errorEl.textContent = "Invalid input detected. Please try again.";
        return;
      }

      if (!SearchValidation.isWithinLength(input.value)) {
        event.preventDefault();
        errorEl.textContent = "Search term must be " + SearchValidation.MIN_LENGTH + "-" +
          SearchValidation.MAX_LENGTH + " characters.";
        return;
      }

      errorEl.textContent = "";
      // requirement (h): valid input - let the form submit through to /search
    });
  </script>
</body>
</html>
